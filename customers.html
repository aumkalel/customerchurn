{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block content %}
<div class="slide-up">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-8 gap-4">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold"><span class="gradient-text">Customer Management</span></h1>
      <p class="text-gray-500 dark:text-gray-400 mt-1 text-sm">Manage and track customer predictions</p>
    </div>
    <div class="flex gap-2">
      <button onclick="deleteAllCustomers()" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-red-500 text-white text-sm font-medium hover:bg-red-600 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>Delete All
      </button>
      <a href="/export-csv" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-500 text-white text-sm font-medium hover:bg-emerald-600 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>Export
      </a>
    </div>
  </div>

  <!-- Filters -->
  <div class="bg-white dark:bg-slate-800/50 rounded-2xl p-4 border border-gray-200/50 dark:border-white/5 shadow-sm mb-6">
    <div class="flex flex-col sm:flex-row gap-3">
      <input id="searchInput" type="text" placeholder="Search customers..." class="flex-1 px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-700/50 border border-gray-200 dark:border-white/10 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
      <select id="riskFilter" class="px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-slate-700/50 border border-gray-200 dark:border-white/10 text-sm focus:ring-2 focus:ring-indigo-500">
        <option value="">All Risks</option>
        <option value="High">High Risk</option>
        <option value="Medium">Medium Risk</option>
        <option value="Low">Low Risk</option>
      </select>
      <button onclick="loadCustomers(1)" class="px-6 py-2.5 rounded-xl bg-indigo-500 text-white text-sm font-medium hover:bg-indigo-600 transition">Filter</button>
    </div>
  </div>

  <!-- Table -->
  <div class="bg-white dark:bg-slate-800/50 rounded-2xl border border-gray-200/50 dark:border-white/5 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead><tr class="border-b border-gray-200 dark:border-white/5">
          <th class="text-left py-3 px-4 font-semibold text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400">ID</th>
          <th class="text-left py-3 px-4 font-semibold text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400">Gender</th>
          <th class="text-left py-3 px-4 font-semibold text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400">Tenure</th>
          <th class="text-left py-3 px-4 font-semibold text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400">Contract</th>
          <th class="text-left py-3 px-4 font-semibold text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400">Monthly</th>
          <th class="text-left py-3 px-4 font-semibold text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400">Prediction</th>
          <th class="text-left py-3 px-4 font-semibold text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400">Risk</th>
          <th class="text-left py-3 px-4 font-semibold text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400">Prob</th>
          <th class="text-left py-3 px-4 font-semibold text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400">Actions</th>
        </tr></thead>
        <tbody id="customerTableBody"></tbody>
      </table>
    </div>
    <div id="pagination" class="flex items-center justify-between p-4 border-t border-gray-200 dark:border-white/5">
      <p id="pageInfo" class="text-xs text-gray-500"></p>
      <div id="pageButtons" class="flex gap-1"></div>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 hidden">
  <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 w-full max-w-md mx-4 shadow-2xl">
    <h3 class="text-lg font-semibold mb-4">Edit Customer</h3>
    <form id="editForm" class="space-y-3">
      <input type="hidden" id="editId">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs font-medium text-gray-500 mb-1">Gender</label><select id="editGender" class="w-full px-3 py-2 rounded-xl bg-gray-50 dark:bg-slate-700/50 border border-gray-200 dark:border-white/10 text-sm"><option>Male</option><option>Female</option></select></div>
        <div><label class="block text-xs font-medium text-gray-500 mb-1">Tenure</label><input id="editTenure" type="number" class="w-full px-3 py-2 rounded-xl bg-gray-50 dark:bg-slate-700/50 border border-gray-200 dark:border-white/10 text-sm"></div>
        <div><label class="block text-xs font-medium text-gray-500 mb-1">Contract</label><select id="editContract" class="w-full px-3 py-2 rounded-xl bg-gray-50 dark:bg-slate-700/50 border border-gray-200 dark:border-white/10 text-sm"><option>Month-to-month</option><option>One year</option><option>Two year</option></select></div>
        <div><label class="block text-xs font-medium text-gray-500 mb-1">Monthly ($)</label><input id="editMonthly" type="number" step="0.01" class="w-full px-3 py-2 rounded-xl bg-gray-50 dark:bg-slate-700/50 border border-gray-200 dark:border-white/10 text-sm"></div>
      </div>
      <div class="flex gap-2 pt-2">
        <button type="submit" class="flex-1 py-2.5 rounded-xl bg-indigo-500 text-white text-sm font-medium hover:bg-indigo-600 transition">Save</button>
        <button type="button" onclick="closeEditModal()" class="flex-1 py-2.5 rounded-xl bg-gray-200 dark:bg-slate-700 text-sm font-medium hover:bg-gray-300 dark:hover:bg-slate-600 transition">Cancel</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentPage=1;
async function loadCustomers(page=1){
  currentPage=page;
  const search=document.getElementById('searchInput').value;
  const risk=document.getElementById('riskFilter').value;
  const r=await fetch(`/api/customers?page=${page}&search=${search}&risk=${risk}`);
  const d=await r.json();
  const tbody=document.getElementById('customerTableBody');
  tbody.innerHTML=d.customers.map(c=>`
    <tr class="border-b border-gray-100 dark:border-white/5 hover:bg-gray-50 dark:hover:bg-white/5 transition">
      <td class="py-3 px-4 font-mono text-xs text-indigo-500">${c.customer_id||'--'}</td>
      <td class="py-3 px-4">${c.gender||'--'}</td>
      <td class="py-3 px-4">${c.tenure||0} mo</td>
      <td class="py-3 px-4"><span class="px-2 py-1 rounded-lg text-xs font-medium ${c.contract==='Month-to-month'?'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400':c.contract==='One year'?'bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400':'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400'}">${c.contract||'--'}</span></td>
      <td class="py-3 px-4">$${c.monthly_charges||0}</td>
      <td class="py-3 px-4"><span class="px-2 py-1 rounded-lg text-xs font-medium ${c.churn_prediction==='Yes'?'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400':'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400'}">${c.churn_prediction||'--'}</span></td>
      <td class="py-3 px-4"><span class="px-2 py-1 rounded-lg text-xs font-bold ${c.risk_category==='High'?'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-400':c.risk_category==='Medium'?'bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-400':'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400'}">${c.risk_category||'--'}</span></td>
      <td class="py-3 px-4">${c.churn_probability||0}%</td>
      <td class="py-3 px-4">
        <div class="flex gap-1">
          <button onclick='openEdit(${JSON.stringify(c)})' class="p-1.5 rounded-lg hover:bg-indigo-50 dark:hover:bg-indigo-900/30 text-indigo-500 transition" title="Edit"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg></button>
          <button onclick="deleteCust(${c.id})" class="p-1.5 rounded-lg hover:bg-red-50 dark:hover:bg-red-900/30 text-red-500 transition" title="Delete"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button>
        </div>
      </td>
    </tr>`).join('');
  document.getElementById('pageInfo').textContent=`Page ${d.page} of ${d.pages} (${d.total} customers)`;
  const pb=document.getElementById('pageButtons');pb.innerHTML='';
  for(let i=1;i<=Math.min(d.pages,5);i++){
    pb.innerHTML+=`<button onclick="loadCustomers(${i})" class="w-8 h-8 rounded-lg text-xs font-medium ${i===d.page?'bg-indigo-500 text-white':'bg-gray-100 dark:bg-slate-700 hover:bg-gray-200 dark:hover:bg-slate-600'} transition">${i}</button>`;
  }
}
async function deleteCust(id){
  if(!confirm('Delete this customer?'))return;
  await fetch(`/api/customers/${id}`,{method:'DELETE'});loadCustomers(currentPage);
}
async function deleteAllCustomers(){
  if(!confirm('Are you sure you want to delete ALL customers? This cannot be undone.'))return;
  if(!confirm('This will permanently remove all customer data. Continue?'))return;
  await fetch('/api/customers/delete-all',{method:'DELETE'});loadCustomers(1);
}
function openEdit(c){
  document.getElementById('editModal').classList.remove('hidden');
  document.getElementById('editId').value=c.id;
  document.getElementById('editGender').value=c.gender;
  document.getElementById('editTenure').value=c.tenure;
  document.getElementById('editContract').value=c.contract;
  document.getElementById('editMonthly').value=c.monthly_charges;
}
function closeEditModal(){document.getElementById('editModal').classList.add('hidden')}
document.getElementById('editForm').onsubmit=async function(e){
  e.preventDefault();
  const id=document.getElementById('editId').value;
  await fetch(`/api/customers/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({gender:document.getElementById('editGender').value,tenure:document.getElementById('editTenure').value,contract:document.getElementById('editContract').value,monthly_charges:document.getElementById('editMonthly').value})});
  closeEditModal();loadCustomers(currentPage);
};
document.getElementById('searchInput').addEventListener('keyup',e=>{if(e.key==='Enter')loadCustomers(1)});
loadCustomers(1);
</script>
{% endblock %}
