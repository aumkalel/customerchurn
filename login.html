<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChurnGuard AI - {% if mode == 'signup' %}Sign Up{% else %}Login{% endif %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif']}}}}</script>
  <style>
    .glass{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08)}
    .gradient-text{background:linear-gradient(135deg,#818cf8,#6366f1,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .float{animation:float 6s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
    .slide-up{animation:slideUp .5s cubic-bezier(.4,0,.2,1)}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .tab-active{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;box-shadow:0 4px 15px rgba(99,102,241,0.3)}
    .input-focus:focus{box-shadow:0 0 0 3px rgba(99,102,241,0.2)}
  </style>
</head>
<body class="bg-[#0c1222] font-sans text-gray-100 min-h-screen flex items-center justify-center p-4">
  <!-- Background -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl float"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-500/10 rounded-full blur-3xl float" style="animation-delay:-3s"></div>
    <div class="absolute top-1/2 right-1/3 w-64 h-64 bg-pink-500/5 rounded-full blur-3xl float" style="animation-delay:-1.5s"></div>
  </div>

  <div class="relative w-full max-w-md slide-up">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center mb-4 shadow-lg shadow-indigo-500/30">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      </div>
      <h1 class="text-3xl font-bold gradient-text">ChurnGuard AI</h1>
      <p class="text-gray-400 text-sm mt-2">AI-Powered Churn Analytics Platform</p>
    </div>

    <!-- Card -->
    <div class="glass rounded-2xl overflow-hidden">
      <!-- Tabs -->
      <div class="flex p-2 m-4 mb-0 rounded-xl bg-white/5">
        <button id="loginTab" onclick="switchTab('login')" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-300 {% if mode != 'signup' %}tab-active{% else %}text-gray-400 hover:text-white{% endif %}">
          Sign In
        </button>
        <button id="signupTab" onclick="switchTab('signup')" class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all duration-300 {% if mode == 'signup' %}tab-active{% else %}text-gray-400 hover:text-white{% endif %}">
          Sign Up
        </button>
      </div>

      <!-- Error Message -->
      {% if error %}
      <div class="mx-6 mt-4 p-3 rounded-xl bg-red-500/10 border border-red-500/20 flex items-center gap-2">
        <svg class="w-4 h-4 text-red-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <p class="text-sm text-red-400">{{ error }}</p>
      </div>
      {% endif %}

      <!-- Login Form -->
      <form id="loginForm" action="/login" method="POST" class="p-6 space-y-4 {% if mode == 'signup' %}hidden{% endif %}">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-2">Email Address</label>
          <div class="relative">
            <div class="absolute left-3 top-1/2 -translate-y-1/2"><svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></div>
            <input name="email" type="email" required class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent input-focus placeholder-gray-500 transition" placeholder="you@example.com">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-2">Password</label>
          <div class="relative">
            <div class="absolute left-3 top-1/2 -translate-y-1/2"><svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></div>
            <input name="password" type="password" required class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent input-focus placeholder-gray-500 transition" placeholder="Enter password">
          </div>
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold hover:shadow-lg hover:shadow-indigo-500/25 transition-all text-sm flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
          Sign In
        </button>
        <p class="text-center text-xs text-gray-500 pt-1">Don't have an account? <button type="button" onclick="switchTab('signup')" class="text-indigo-400 hover:text-indigo-300 font-medium">Sign Up</button></p>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" action="/signup" method="POST" class="p-6 space-y-4 {% if mode != 'signup' %}hidden{% endif %}">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-2">Full Name</label>
          <div class="relative">
            <div class="absolute left-3 top-1/2 -translate-y-1/2"><svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></div>
            <input name="username" type="text" required class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent input-focus placeholder-gray-500 transition" placeholder="Your full name">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-2">Email Address</label>
          <div class="relative">
            <div class="absolute left-3 top-1/2 -translate-y-1/2"><svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg></div>
            <input name="email" type="email" required class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent input-focus placeholder-gray-500 transition" placeholder="you@example.com">
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-2">Password</label>
          <div class="relative">
            <div class="absolute left-3 top-1/2 -translate-y-1/2"><svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></div>
            <input name="password" type="password" required minlength="4" class="w-full pl-10 pr-4 py-3 rounded-xl bg-white/5 border border-white/10 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent input-focus placeholder-gray-500 transition" placeholder="Min. 4 characters">
          </div>
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold hover:shadow-lg hover:shadow-indigo-500/25 transition-all text-sm flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
          Create Account
        </button>
        <p class="text-center text-xs text-gray-500 pt-1">Already have an account? <button type="button" onclick="switchTab('login')" class="text-indigo-400 hover:text-indigo-300 font-medium">Sign In</button></p>
      </form>
    </div>

    <!-- Footer -->
    <p class="text-center text-xs text-gray-600 mt-6">Secured by ChurnGuard AI &bull; ML-Powered Analytics</p>
  </div>

  <script>
  function switchTab(tab){
    const lf=document.getElementById('loginForm'),sf=document.getElementById('signupForm');
    const lt=document.getElementById('loginTab'),st=document.getElementById('signupTab');
    if(tab==='signup'){
      lf.classList.add('hidden');sf.classList.remove('hidden');
      st.classList.add('tab-active');lt.classList.remove('tab-active');
      lt.classList.add('text-gray-400');st.classList.remove('text-gray-400');
    }else{
      sf.classList.add('hidden');lf.classList.remove('hidden');
      lt.classList.add('tab-active');st.classList.remove('tab-active');
      st.classList.add('text-gray-400');lt.classList.remove('text-gray-400');
    }
  }
  </script>
</body>
</html>
